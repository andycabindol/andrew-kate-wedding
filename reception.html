<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Reception — Katie &amp; Andrew</title>
    <meta name="description" content="The wedding reception of Katie and Andrew at Raspberry Hill Bed &amp; Breakfast in Ames, Iowa." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      (function () {
        try {
          if (new URLSearchParams(location.search).has('gate')) sessionStorage.removeItem('ka-session');
          if (!new URLSearchParams(location.search).has('gate') && sessionStorage.getItem('ka-session') === '5313e5bf17148de844ff74be3663d47c6e361ca469b30a36337701233c89a15e') {
            document.documentElement.classList.add('is-unlocked');
          } else {
            document.documentElement.classList.add('is-locked');
          }
        } catch (e) {
          document.documentElement.classList.add('is-locked');
        }
      })();
    </script>
  </head>
  <body class="subpage">
    <div class="site-gate" id="siteGate" role="dialog" aria-modal="true" aria-labelledby="siteGateTitle">
      <div class="site-gate__enter">
        <p class="site-gate__kicker">Private invitation</p>
        <h1 class="site-gate__title" id="siteGateTitle"><span>Katie &amp; Andrew</span></h1>
        <form class="site-gate__form" autocomplete="off">
          <label class="site-gate__label" for="siteGatePassword">Password</label>
          <input
            class="site-gate__input"
            id="siteGatePassword"
            name="password"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            maxlength="12"
            required
          />
          <button class="site-gate__submit" type="submit">Enter</button>
          <p class="site-gate__error" role="alert" hidden>That password isn’t right.</p>
        </form>
      </div>
      <div class="site-gate__load" hidden>
        <div class="site-gate__names">
          <span class="site-gate__name site-gate__name--katie">Katie</span>
          <span class="site-gate__mark">&amp;</span>
          <span class="site-gate__name site-gate__name--andrew">Andrew</span>
        </div>
        <p class="site-gate__percent" aria-live="polite">0%</p>
        <div class="site-gate__meter" aria-hidden="true"><span class="site-gate__fill"></span></div>
      </div>
    </div>
    <template id="siteContent">
    <div class="viewport-blur" aria-hidden="true">
      <div class="viewport-blur__layer viewport-blur__layer--1"></div>
      <div class="viewport-blur__layer viewport-blur__layer--2"></div>
      <div class="viewport-blur__layer viewport-blur__layer--3"></div>
      <div class="viewport-blur__layer viewport-blur__layer--4"></div>
      <div class="viewport-blur__layer viewport-blur__layer--5"></div>
      <div class="viewport-blur__layer viewport-blur__layer--6"></div>
    </div>

          <span></span>

      </div>

      <div class="nav__mobile" id="navMobile" aria-hidden="true">
        <div class="nav__menu">

    <main>
      <section class="section venue venue-page">
        <div class="container">
          <p class="label">The Reception</p>
          <h1 class="section-heading section-heading--center">Raspberry Hill Bed &amp; Breakfast</h1>
          <p class="body-text body-text--center venue-page__intro">
            After the ceremony, we will celebrate together at Raspberry Hill in Ames.
          </p>

          <div class="carousel" id="receptionCarousel">
            <div class="carousel__track">
              <div class="carousel__slide active">
                <img
                  src="/images/reception/reception-1.jpeg"
                  alt="A decorated reception table beneath tall wooden windows at Raspberry Hill."
                />
              </div>
              <div class="carousel__slide">
                <img
                  src="/images/reception/reception-2.jpeg"
                  alt="Open-air pavilion at Raspberry Hill in Ames with a snow-covered lawn."
                />
              </div>
              <div class="carousel__slide">
                <img
                  src="/images/reception/reception-3.jpeg"
                  alt="Cottage at Raspberry Hill surrounded by flowers and green foliage."
                />
              </div>
            </div>
            <button class="carousel__btn carousel__btn--prev" aria-label="Previous slide">
              <img src="/images/arrow-left.svg" alt="" />
            </button>
            <button class="carousel__btn carousel__btn--next" aria-label="Next slide">
              <img src="/images/arrow-right.svg" alt="" />
            </button>
          </div>

          <div class="venue__info">
            <p class="venue__address">5500 240th St, Ames, IA 50014</p>
            <a
